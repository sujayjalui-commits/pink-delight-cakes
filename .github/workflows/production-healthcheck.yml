name: Production Healthcheck

on:
  schedule:
    - cron: "19 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-healthcheck.yml"
      - "scripts/maintenance/check-production.mjs"
      - "scripts/maintenance/check-browser-smoke.mjs"
      - "scripts/maintenance/check-admin-auth.mjs"
  workflow_run:
    workflows: [Deploy Pages, Deploy Worker]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://pink-delight-cakes-api.sujayjalui.workers.dev' }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://pink-delight-cakes.pages.dev' }}
      ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL || '' }}
      MONITORING_WEBHOOK_URL: ${{ secrets.MONITORING_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run production checks
        timeout-minutes: 10
        run: |
          node scripts/maintenance/check-production.mjs
          node scripts/maintenance/check-browser-smoke.mjs
          node scripts/maintenance/check-admin-auth.mjs

      - name: Send failure alert
        if: failure() && env.MONITORING_WEBHOOK_URL != ''
        env:
          MONITORING_ALERT_TITLE: Production healthcheck failed
          MONITORING_ALERT_BODY: One or more public production checks failed for the storefront or API.
          MONITORING_ALERT_SEVERITY: error
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/maintenance/send-webhook-alert.mjs
