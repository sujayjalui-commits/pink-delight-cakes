name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "database/**"
      - "packages/shared/**"
      - "scripts/deploy/**"
      - "scripts/backups/**"
      - "scripts/maintenance/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/validate.yml"
      - ".github/workflows/d1-backup.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml

  backup:
    needs: validate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/d1-backup.yml
    secrets: inherit

  deploy:
    needs: [validate, backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONFIGURED_SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      CONFIGURED_ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL }}
      CONFIGURED_API_BASE_URL: ${{ vars.API_BASE_URL }}
      CONFIGURED_CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install repo dependencies
        run: npm ci --ignore-scripts

      - name: Install Wrangler
        run: npm install --global wrangler@4.80.0

      - name: Prepare deploy-specific Wrangler config
        env:
          SITE_BASE_URL: ${{ env.CONFIGURED_SITE_BASE_URL }}
          ADMIN_BASE_URL: ${{ env.CONFIGURED_ADMIN_BASE_URL }}
          API_BASE_URL: ${{ env.CONFIGURED_API_BASE_URL }}
          CORS_ALLOWED_ORIGINS: ${{ env.CONFIGURED_CORS_ALLOWED_ORIGINS }}
        run: npm run deploy:prepare:worker

      - name: Compile deployment bundle before remote changes
        run: wrangler deploy --dry-run --config wrangler.deploy.toml

      - name: Check pending remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations list pink-delight-cakes --remote --config wrangler.deploy.toml

      - name: Apply pending remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply pink-delight-cakes --remote --config wrangler.deploy.toml

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.deploy.toml
